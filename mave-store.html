<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAVE® Molecular Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@6.5.1/dist/framer-motion.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #F5F0E8; font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font-family: inherit; }
  img { display: block; }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-track { background: #F5F0E8; }
  ::-webkit-scrollbar-thumb { background: #C8A96E; }

  .mave-catalog-page {
    position: relative;
    min-height: 100vh;
    padding-top: 72px;
    background: #F5F0E8;
    overflow: hidden;
  }
  .mave-catalog-page::before {
    content: "";
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    height: 840px;
    background-image: url('assets/collections-hero.png');
    background-size: 100% auto;
    background-position: center -225px;
    background-repeat: no-repeat;
    z-index: 0;
  }
  .mave-catalog-page::after {
    content: "";
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    height: 840px;
    background:
      linear-gradient(180deg, rgba(245,240,232,0) 0%, rgba(245,240,232,0) 58%, rgba(245,240,232,0.34) 78%, rgba(245,240,232,0.86) 94%, #F5F0E8 100%),
      linear-gradient(90deg, rgba(245,240,232,0.54) 0%, rgba(245,240,232,0.24) 42%, rgba(245,240,232,0.08) 68%, rgba(245,240,232,0) 100%);
    z-index: 1;
    pointer-events: none;
  }
  .mave-catalog-scale {
    position: relative;
    z-index: 2;
    width: 100%;
    margin-left: 0;
    margin-bottom: 0;
    transform: none;
    transform-origin: top center;
  }
  .mave-catalog-hero {
    position: relative;
    min-height: 368px;
    overflow: hidden;
  }
  .mave-catalog-hero-inner {
    position: relative;
    z-index: 2;
    min-height: 368px;
    display: grid;
    grid-template-columns: 1.24fr 0.76fr;
    gap: 72px;
    align-items: end;
    padding: 42px 70px 22px;
  }
  .mave-catalog-products {
    padding: 0 70px 48px;
    background: transparent;
  }
  .mave-catalog-grid { gap: 16px !important; }
  .mave-catalog-filter {
    position: relative;
  }
  .mave-catalog-filter::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -7px;
    height: 1px;
    background: #C8A96E;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 520ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .mave-catalog-filter[data-active="true"]::after,
  .mave-catalog-filter:hover::after {
    transform: scaleX(1);
  }

  /* Focus states for keyboard navigation */
  button:focus-visible, a:focus-visible {
    outline: 2px solid #C8A96E;
    outline-offset: 3px;
  }

  /* Respect reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Mobile responsive overrides */
  @media (max-width: 768px) {
    /* Nav */
    .mave-nav-links { display: none !important; }
    .mave-nav { padding: 0 20px !important; }
    .mave-hamburger { display: flex !important; }
    .mave-cart-action { display: none !important; }

    /* Hero */
    .mave-hero-content { padding: 0 28px !important; }
    .mave-hero-title { font-size: clamp(40px,11vw,72px) !important; }

    /* Grids в†’ single column on mobile, 2-col on tablet */
    .mave-grid-4 { grid-template-columns: repeat(2,1fr) !important; gap: 8px !important; }
    .mave-grid-3 { grid-template-columns: repeat(2,1fr) !important; }
    .mave-grid-2 { grid-template-columns: 1fr !important; }
    .mave-grid-footer { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }

    /* Section padding */
    .mave-section { padding: 56px 24px !important; }
    .mave-section-dark { padding: 72px 24px !important; }

    /* Split feature */
    .mave-split-text { padding: 44px 28px !important; }

    /* Routine connecting line */
    .mave-routine-line { display: none !important; }

    /* Liquid reveal */
    .mave-liquid-reveal-inner { grid-template-columns: 1fr !important; gap: 30px !important; padding: 92px 28px 72px !important; align-content: center !important; }
    .mave-liquid-copy { order: 2 !important; text-align: left !important; left: 8% !important; top: 20% !important; max-width: 76vw !important; }
    .mave-liquid-copy h2 { font-size: clamp(38px, 10vw, 54px) !important; }
    .mave-liquid-media { order: 1 !important; width: min(72vw, 360px) !important; max-width: 360px !important; margin: 0 auto !important; }
    .mave-liquid-boundary { display: none !important; }
    .mave-pdp-shell { padding-top: 72px !important; }
    .mave-pdp-buybox { position: relative !important; top: auto !important; min-height: auto !important; padding: 48px 28px !important; }
    .mave-pdp-hero-image { height: 56vh !important; }
    .mave-pdp-thumb { height: 180px !important; }
    .mave-pdp-tabs { grid-template-columns: 1fr !important; }
    .mave-pdp-notes { padding: 68px 28px !important; }
    .mave-catalog-grid { gap: 10px !important; }
    .mave-catalog-scale {
      width: 100% !important;
      margin-left: 0 !important;
      margin-bottom: 0 !important;
      transform: none !important;
    }
    .mave-catalog-hero,
    .mave-catalog-hero-inner {
      min-height: auto !important;
    }
    .mave-catalog-hero-inner {
      grid-template-columns: 1fr !important;
      gap: 44px !important;
      padding: 92px 24px 52px !important;
    }
    .mave-catalog-products {
      padding: 0 24px 72px !important;
    }
    .mave-catalog-controls { align-items: flex-start !important; }
    .mave-pdp-gallery { min-height: 68vh !important; }
    .mave-pdp-thumbs { position: relative !important; left: auto !important; bottom: auto !important; padding: 2px !important; background: #1A1410 !important; }
  }

  @media (max-width: 480px) {
    .mave-grid-4 { grid-template-columns: 1fr !important; }
    .mave-grid-3 { grid-template-columns: 1fr !important; }
    .mave-pdp-hero-image { height: 48vh !important; }
    .mave-pdp-thumb { height: 140px !important; }
  }

  .mave-login-page {
    min-height: 100dvh;
    padding-top: 72px;
    background: #F5F0E8;
    color: #1A1410;
    overflow-x: hidden;
  }
  .mave-login-scale {
    width: 100%;
    transform: none;
    transform-origin: top center;
    margin-left: 0;
    margin-bottom: 0;
    translate: none;
  }
  .mave-login-shell {
    height: auto;
    min-height: calc(100dvh - 72px);
    display: grid;
    grid-template-columns: minmax(500px, 49.1vw) minmax(560px, 1fr);
  }
  .mave-login-visual {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: #E8DDD0;
  }
  .mave-login-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 32% center;
    filter: saturate(0.82) contrast(0.95) brightness(1.04);
  }
  .mave-login-visual-copy {
    position: absolute;
    left: 46.4%;
    top: 25.8%;
    width: min(340px, 40%);
  }
  .mave-login-main {
    position: relative;
    padding: 48px min(8vw, 150px) 86px 78px;
    border-left: 0;
    background: #F5F0E8;
  }
  .mave-login-main::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -180px;
    width: 240px;
    background: linear-gradient(90deg, rgba(245,240,232,0) 0%, rgba(245,240,232,0.56) 42%, #F5F0E8 82%, #F5F0E8 100%);
    pointer-events: none;
  }
  .mave-login-form-panel {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto 0 36px;
  }
  .mave-member-benefits {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(200,169,110,0.12), transparent 42%),
      linear-gradient(135deg, #1A1410 0%, #120E0B 100%);
    color: #F5F0E8;
    padding: 76px 80px 74px;
    border-top: 1px solid rgba(200,169,110,0.16);
    border-bottom: 1px solid rgba(200,169,110,0.16);
    text-align: center;
  }
  .mave-member-benefits::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 0%, rgba(245,240,232,0.045) 48%, transparent 72%);
    pointer-events: none;
  }
  .mave-member-benefits-grid {
    position: relative;
    max-width: 820px;
    margin: 34px auto 34px;
    display: flex;
    justify-content: center;
    gap: clamp(38px, 4.6vw, 72px);
    align-items: start;
    flex-wrap: nowrap;
  }
  .mave-member-benefit {
    display: grid;
    justify-items: center;
    gap: 12px;
    width: 112px;
    will-change: transform, opacity;
  }
  .mave-member-benefit img {
    width: 38px;
    height: 38px;
    object-fit: contain;
  }
  .mave-login-input {
    width: 100%;
    height: 50px;
    border: 1px solid rgba(107,87,68,0.28);
    background: rgba(245,240,232,0.36);
    color: #1A1410;
    padding: 0 20px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.02em;
    outline: none;
    transition: border-color 520ms cubic-bezier(0.32,0.72,0,1), background 520ms cubic-bezier(0.32,0.72,0,1);
  }
  .mave-login-input:focus {
    border-color: rgba(200,169,110,0.86);
    background: rgba(255,251,244,0.62);
  }
  .mave-login-page .mave-site-footer {
    padding: 56px 80px 30px !important;
  }
  .mave-login-page .mave-site-footer-grid {
    gap: 42px !important;
    margin-bottom: 24px !important;
  }
  .mave-login-page .mave-site-footer-divider {
    margin-bottom: 18px !important;
  }
  .mave-login-page .mave-site-footer-bottom {
    align-items: center;
  }
  @media (max-width: 1180px) {
    .mave-login-scale { width: 100%; transform: none; margin-left: 0; margin-bottom: 0; translate: none; }
    .mave-login-shell { grid-template-columns: 1fr; height: auto; min-height: 0; }
    .mave-login-visual { min-height: 640px; }
    .mave-login-visual-copy { left: 50%; width: min(380px, 42vw); }
    .mave-login-main { padding: 58px 42px 64px; border-left: 0; background: #F5F0E8; }
    .mave-login-main::before { display: none; }
    .mave-login-form-panel { max-width: none; }
    .mave-member-benefits { padding: 58px 42px 58px; }
    .mave-member-benefits-grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); max-width: 620px; gap: 28px; }
  }
  @media (max-width: 640px) {
    .mave-login-visual { min-height: 430px; }
    .mave-login-visual img { object-position: 26% center; }
    .mave-login-visual-copy { display: none; }
    .mave-login-main { padding: 48px 24px 56px; }
    .mave-member-benefits { padding: 40px 24px 42px; }
    .mave-member-benefits-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 24px 18px; }
    .mave-login-page .mave-site-footer { padding: 40px 24px 26px !important; }
  }

  .mave-account-page {
    min-height: 100dvh;
    padding-top: 72px;
    background: #F5F0E8;
    color: #1A1410;
    overflow-x: hidden;
  }
  .mave-account-layout {
    position: relative;
    display: grid;
    grid-template-columns: 150px 266px minmax(0, 1fr);
    min-height: calc(100dvh - 72px);
  }
  .mave-account-bg-strip {
    position: relative;
    overflow: hidden;
    border-right: 1px solid rgba(107,87,68,0.12);
  }
  .mave-account-bg-strip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 24% center;
    filter: saturate(0.7) contrast(0.88) brightness(1.08);
  }
  .mave-account-bg-strip::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(245,240,232,0.24), rgba(245,240,232,0.72));
    backdrop-filter: blur(2px);
  }
  .mave-account-sidebar {
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(107,87,68,0.14);
    padding: 46px 18px 38px;
    background: rgba(245,240,232,0.72);
  }
  .mave-account-profile {
    display: grid;
    grid-template-columns: 50px 1fr;
    gap: 15px;
    align-items: center;
    margin: 0 10px 38px;
  }
  .mave-account-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    background: #D8C9B6;
  }
  .mave-account-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: saturate(0.78) contrast(0.9);
  }
  .mave-account-main {
    position: relative;
    padding: 44px clamp(42px, 4vw, 62px) 48px;
    background:
      radial-gradient(circle at 72% 0%, rgba(221,208,188,0.22), transparent 36%),
      #F5F0E8;
  }
  .mave-account-top {
    display: grid;
    grid-template-columns: minmax(310px, .86fr) minmax(430px, 1.14fr);
    gap: 42px;
    align-items: start;
    margin-bottom: 24px;
  }
  .mave-account-quiz {
    display: grid;
    grid-template-columns: 1fr 285px;
    min-height: 222px;
    border: 1px solid rgba(107,87,68,0.13);
    background: rgba(245,240,232,0.44);
  }
  .mave-account-quiz img {
    width: 100%;
    height: 100%;
    min-height: 222px;
    object-fit: cover;
    object-position: 58% center;
    filter: saturate(0.82) contrast(0.94) brightness(1.04);
  }
  .mave-account-quiz-copy {
    padding: 28px 32px 26px;
    background: rgba(245,240,232,0.58);
  }
  .mave-account-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .mave-account-summary-card,
  .mave-account-panel {
    border: 1px solid rgba(107,87,68,0.18);
    background: rgba(245,240,232,0.62);
  }
  .mave-account-summary-card {
    min-height: 126px;
    padding: 24px 20px 20px;
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 16px;
    align-items: start;
  }
  .mave-account-icon-disc {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(232,221,208,0.72);
    color: #B88D4D;
  }
  .mave-account-panels {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr);
    gap: 14px;
  }
  .mave-account-panel {
    padding: 22px;
  }
  .mave-account-order-row {
    display: grid;
    grid-template-columns: 50px 1fr auto auto;
    gap: 18px;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid rgba(107,87,68,0.12);
  }
  .mave-account-order-row:last-of-type { border-bottom: 0; }
  .mave-account-order-thumb {
    width: 50px;
    height: 50px;
    object-fit: cover;
    background: #E8DDD0;
  }
  .mave-account-rewards-box {
    border: 1px solid rgba(107,87,68,0.14);
    background: rgba(245,240,232,0.66);
    padding: 20px;
    margin-top: 15px;
  }
  .mave-account-progress {
    height: 7px;
    background: rgba(107,87,68,0.10);
    margin: 18px 0 14px;
    overflow: hidden;
  }
  .mave-account-progress span {
    display: block;
    height: 100%;
    width: 34%;
    background: linear-gradient(90deg, #B88D4D, #C8A96E);
  }
  .mave-account-mini-benefits {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid rgba(107,87,68,0.12);
    margin: 20px -20px -20px;
  }
  .mave-account-mini-benefits div {
    min-height: 62px;
    display: grid;
    grid-template-columns: 19px minmax(0, 1fr);
    gap: 9px;
    align-items: center;
    padding: 13px 12px;
    border-right: 1px solid rgba(107,87,68,0.10);
  }
  .mave-account-mini-benefits div:last-child { border-right: 0; }
  .mave-account-nav {
    display: grid;
    gap: 7px;
  }
  .mave-account-nav button,
  .mave-account-logout {
    width: 100%;
    height: 50px;
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 15px;
    align-items: center;
    background: transparent;
    border: 0;
    color: rgba(26,20,16,0.62);
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-align: left;
    padding: 0 14px;
    transition: color 360ms cubic-bezier(0.32,0.72,0,1), background 360ms cubic-bezier(0.32,0.72,0,1), transform 360ms cubic-bezier(0.32,0.72,0,1);
  }
  .mave-account-nav button:hover,
  .mave-account-nav button.is-active,
  .mave-account-logout:hover {
    color: #9A7A42;
    background: rgba(232,221,208,0.46);
    transform: translateX(2px);
  }
  .mave-account-logout {
    margin-top: auto;
    border-top: 1px solid rgba(107,87,68,0.12);
    padding-top: 22px;
  }
  .mave-account-status {
    display: inline-grid;
    place-items: center;
    min-width: 72px;
    height: 24px;
    padding: 0 10px;
    background: rgba(202,213,182,0.45);
    color: #66704D;
    font-family: 'Montserrat', sans-serif;
    font-size: 7px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .mave-account-status.is-progress {
    background: rgba(232,221,208,0.82);
    color: #9A7A42;
  }
  .mave-account-status.is-cancelled {
    background: rgba(232,221,208,0.66);
    color: rgba(61,43,31,0.64);
  }
  .mave-account-page .mave-site-footer {
    padding: 52px 80px 28px !important;
  }
  .mave-account-page .mave-site-footer-grid {
    gap: 42px !important;
    margin-bottom: 28px !important;
  }
  .mave-account-page .mave-site-footer-divider {
    margin-bottom: 18px !important;
  }
  .mave-orders-top {
    display: grid;
    grid-template-columns: minmax(300px, .78fr) minmax(520px, 1.22fr);
    gap: clamp(42px, 5vw, 68px);
    align-items: start;
    margin-bottom: 34px;
  }
  .mave-orders-help {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 320px;
    height: 196px;
    min-height: 196px;
    border: 1px solid rgba(107,87,68,0.13);
    background: rgba(245,240,232,0.54);
    overflow: hidden;
  }
  .mave-orders-help img {
    width: 100%;
    height: 100%;
    min-height: 0;
    object-fit: cover;
    object-position: center;
    filter: saturate(0.78) contrast(0.94) brightness(1.04);
  }
  .mave-orders-help-copy {
    padding: 32px 38px 28px;
    background: rgba(245,240,232,0.62);
  }
  .mave-orders-controls {
    display: grid;
    grid-template-columns: 1fr minmax(260px, 360px);
    gap: 24px;
    align-items: center;
    margin-bottom: 24px;
  }
  .mave-orders-tabs {
    display: flex;
    gap: clamp(28px, 4vw, 64px);
    align-items: center;
  }
  .mave-orders-tab {
    height: 42px;
    padding: 0 20px;
    border: 0;
    background: transparent;
    color: rgba(26,20,16,0.68);
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 300;
  }
  .mave-orders-tab.is-active {
    border-radius: 999px;
    background: rgba(232,221,208,0.82);
    color: #9A7A42;
  }
  .mave-orders-search {
    height: 42px;
    border: 1px solid rgba(107,87,68,0.16);
    background: rgba(245,240,232,0.48);
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    align-items: center;
    padding: 0 18px;
    color: rgba(26,20,16,0.5);
  }
  .mave-orders-search input {
    border: 0;
    outline: 0;
    background: transparent;
    color: #1A1410;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 300;
  }

const productFromUrl = () => {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('product');
  return slug ? PRODUCTS.find(p => p.slug === slug) || null : null;
};

const viewFromUrl = () => {
  if (window.location.pathname === '/account') return 'account';
  if (window.location.pathname === '/profile') return 'profile';
  if (window.location.pathname === '/orders') return 'orders';
  if (window.location.pathname === '/orders/1045') return 'orderDetail';
  if (window.location.pathname === '/addresses') return 'addresses';
  if (window.location.pathname === '/checkout/contact') return 'checkoutContact';
  if (window.location.pathname === '/register') return 'register';
  if (window.location.pathname === '/forgot-password') return 'forgot';
  if (window.location.pathname === '/science') return 'science';
  if (window.location.pathname === '/collections') return 'catalog';
  const params = new URLSearchParams(window.location.search);
  return params.get('view') === 'catalog' ? 'catalog' : 'landing';
};

const setProductUrl = product => {
  const url = new URL(window.location.href);
  if (product) url.searchParams.set('product', product.slug);
  else url.searchParams.delete('product');
  if (product) url.searchParams.delete('view');
  window.history.pushState({}, '', url);
};

const syncCartForNextCheckout = cart => {
  const toNumber = value => Number(String(value || '').replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
  const toPath = value => String(value || '').startsWith('/') ? value : `/${value}`;
  const items = cart.map(item => ({
    product: {
      id: item.slug || String(item.id),
      name: item.name,
      price: toNumber(item.price),
      shortDescription: item.desc || '',
      description: item.desc || '',
      step: item.collection || '',
      image: toPath(item.image),
      ingredients: [],
      benefits: [],
      size: item.vol || '',
    },
    quantity: item.qty,
  }));
  localStorage.setItem('mave-cart', JSON.stringify({ state: { items }, version: 0 }));
};

/* в”Ђв”Ђ PRODUCT DRAWER в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
const ProductDrawer = ({ product, onClose, onAdd }) => {
  const [qty, setQty] = React.useState(1);
  const [added, setAdded] = React.useState(false);
  React.useEffect(() => { if (product) { setQty(1); setAdded(false); } }, [product]);
  React.useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  const handleAdd = () => {
    onAdd(product, qty);
    setAdded(true);
    setTimeout(() => { setAdded(false); onClose(); }, 1500);
  };

  return (
    <AnimatePresence>
      {product && (
        <>
          <motion.div key="bd" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
            onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(26,20,16,0.55)', zIndex: 600, backdropFilter: 'blur(6px)' }} />
          <motion.div key="dw" initial={{ y: '100%' }} animate={{ y: 0 }} exit={{ y: '100%' }}
            transition={{ duration: 0.52, ease: [0.4, 0, 0.2, 1] }}
            style={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 601, maxHeight: '86vh', background: C.cream, display: 'grid', gridTemplateColumns: '1fr 1.3fr', boxShadow: '0 -24px 80px rgba(26,20,16,0.28)' }}>
            <div style={{ overflow: 'hidden', maxHeight: '86vh' }}>
              <motion.img src={product.image} alt={product.name} initial={{ scale: 1.08 }} animate={{ scale: 1 }}
                transition={{ duration: 0.7 }} style={{ width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.88)' }} />
            </div>
            <div style={{ padding: '52px 60px', overflowY: 'auto', display: 'flex', flexDirection: 'column', justifyContent: 'center', position: 'relative' }}>
              <button onClick={onClose} style={{ position: 'absolute', top: 20, right: 24, background: 'none', border: 'none', cursor: 'pointer', color: C.gray, fontSize: 22, lineHeight: 1, transition: 'color 0.3s' }}
                onMouseEnter={e => e.target.style.color = C.black} onMouseLeave={e => e.target.style.color = C.gray}>×</button>
              <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 9, fontWeight: 400, letterSpacing: '0.32em', textTransform: 'uppercase', color: C.gold, display: 'block', marginBottom: 14 }}>{product.collection}</span>
              <h2 style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 'clamp(18px,2vw,28px)', fontWeight: 200, letterSpacing: '0.26em', textTransform: 'uppercase', color: C.black, lineHeight: 1.3, marginBottom: 10 }}>{product.name}</h2>
              <div style={{ width: 36, height: 2, background: product.accent, marginBottom: 28 }}></div>
              <p style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 14, fontWeight: 300, lineHeight: 1.95, letterSpacing: '0.03em', color: C.earth, marginBottom: 20 }}>{product.desc}</p>
              <div style={{ borderTop: `1px solid ${C.linen}`, borderBottom: `1px solid ${C.linen}`, padding: '18px 0', marginBottom: 32 }}>
              <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 11, fontWeight: 300, letterSpacing: '0.08em', color: C.gray, display: 'block', marginBottom: 8 }}>Formula role</span>
                <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 28, fontWeight: 300, color: C.black }}>{product.price}</span>
              </div>
              <div style={{ display: 'flex', gap: 12, marginBottom: 14 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 16, border: `1px solid ${C.taupe}`, padding: '0 18px' }}>
                  <button onClick={() => setQty(q => Math.max(1, q - 1))} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 18, color: C.black, padding: '13px 0', lineHeight: 1 }}>−</button>
                  <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 13, fontWeight: 300, color: C.black, minWidth: 22, textAlign: 'center' }}>{qty}</span>
                  <button onClick={() => setQty(q => q + 1)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 18, color: C.black, padding: '13px 0', lineHeight: 1 }}>+</button>
                </div>
                <motion.button onClick={handleAdd} whileTap={{ scale: 0.97 }}
                  style={{ flex: 1, padding: '15px 24px', background: added ? C.gold : C.black, color: added ? C.black : C.gold, fontFamily: "'Montserrat',sans-serif", fontSize: 10, fontWeight: 400, letterSpacing: '0.28em', textTransform: 'uppercase', border: 'none', cursor: 'pointer', transition: 'background 0.4s, color 0.4s' }}>
                  {added ? 'Added ✓' : 'Add to cart'}
                </motion.button>
              </div>
              <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 10, fontWeight: 300, letterSpacing: '0.1em', color: C.gray, textAlign: 'center' }}>Free shipping on orders over €120 · 30-day returns</span>
            </div>
          </motion.div>
        </>
      )}
    </AnimatePresence>
  );

              </form>
            </div>
          </div>
        </section>
        <AuthBenefits onRegister={onRegister} />
        <Footer />
      </div>
    </main>
  );
};

              {index < arr.length - 1 && <span className="mave-checkout-line" />}
            </React.Fragment>
          ))}
        </div>

        <div className="mave-checkout-content">
          <section className="mave-checkout-form" aria-label="Contact information">
            <h1 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 'clamp(54px,4.8vw,74px)', fontWeight: 300, fontStyle: 'italic', lineHeight: 1, color: C.black, marginBottom: loggedIn ? 28 : 18 }}>Contact<span style={{ color: C.gold }}>.</span></h1>
            {!loggedIn && (
              <p style={{ ...muted, fontSize: 14, marginBottom: 28 }}>Already have an account? <button type="button" onClick={onLogin} style={{ border: 0, borderBottom: '1px solid rgba(154,122,66,0.46)', background: 'transparent', color: C.goldD, cursor: 'pointer', padding: 0, font: 'inherit' }}>Log in</button></p>
            )}
            <span style={{ ...tiny, display: 'block', marginBottom: 12 }}>Contact information</span>

            {loggedIn ? (
              <div className="mave-checkout-field-card mave-checkout-logged-card">
                <div className="mave-checkout-login-row">
                  <span style={{ width: 34, height: 34, borderRadius: '50%', border: '1px solid rgba(107,87,68,0.24)', display: 'grid', placeItems: 'center', color: 'rgba(26,20,16,0.68)' }}><AccountLineIcon type="profile" size={20} /></span>
                  <span style={muted}>Logged in as Anna Müller</span>
                  <button type="button" style={{ border: 0, borderBottom: '1px solid rgba(154,122,66,0.46)', background: 'transparent', color: C.goldD, cursor: 'pointer', padding: 0, fontFamily: "'Montserrat',sans-serif", fontSize: 11 }}>Use another account</button>
                </div>
                {[
                  ['Full name', 'Anna Müller'],
                  ['Email address', 'anna.muller@example.com'],
                  ['Phone number (optional)', '+49 171 1234567'],
                ].map(([label, value]) => (
                  <div className="mave-checkout-input-line" key={label}>
                    <label>{label}</label>
                    <input defaultValue={value} />
                  </div>
                ))}
              </div>
            ) : (
              <>
                <label className="mave-checkout-field-card mave-checkout-email-card">
                  <span style={{ color: 'rgba(26,20,16,0.7)' }}><AccountLineIcon type="envelope" size={26} /></span>
                  <span className="mave-checkout-email-input">
                    <span>Email address</span>
                    <input type="email" placeholder="Enter your email" required />
                  </span>
                </label>
              </>
            )}

            <label className="mave-checkout-check">
              <span>✓</span>
              <span className="mave-checkout-check-text">{loggedIn ? 'Email me order updates and exclusive product news' : 'Subscribe to our newsletter and get 10% off your first order'}</span>
            </label>

            {!loggedIn && (
              <>
                <div className="mave-checkout-or">OR</div>
                <div className="mave-checkout-socials">
                  <button type="button" className="mave-checkout-social"><b style={{ color: '#4285F4', fontSize: 18 }}>G</b>Continue with Google</button>
                  <button type="button" className="mave-checkout-social"><b style={{ fontSize: 18 }}>●</b>Continue with Apple</button>
                </div>
                <p className="mave-checkout-note"><span style={{ color: 'rgba(26,20,16,0.56)' }}><AccountLineIcon type="lock" size={18} /></span><span className="mave-checkout-note-text">We'll only use your email to send you order updates and important information.</span></p>
              </>
            )}

            {loggedIn && <button type="button" className="mave-checkout-primary">Continue to delivery <span style={{ fontSize: 26, fontWeight: 200 }}>›</span></button>}
          </section>

          <aside className="mave-checkout-summary" aria-label="Order summary">
            <div className="mave-checkout-summary-head">
              <span style={tiny}>Order summary</span>
              <button type="button" style={{ border: 0, borderBottom: '1px solid rgba(154,122,66,0.46)', background: 'transparent', color: C.goldD, cursor: 'pointer', padding: 0, fontFamily: "'Montserrat',sans-serif", fontSize: 11 }}>Edit cart</button>
            </div>
            {items.map(([name, size, price, pos]) => (
              <div className="mave-checkout-summary-item" key={name}>
                <span className="mave-checkout-summary-thumb" style={{ backgroundPosition: pos }} />
                <span>
                  <strong style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 13, fontWeight: 500, color: C.black, display: 'block', marginBottom: 8 }}>{name}</strong>
                  <span style={muted}>{size}</span>
                </span>
                <span style={muted}>Qty: 1</span>
                <strong style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 13, fontWeight: 600, color: C.black }}>{price}</strong>
              </div>
            ))}
            <div className="mave-checkout-total-lines">
              {[
                ['Subtotal', '€89,00'],
                ['Shipping', 'Free'],
                ['Tax', '€0,00'],
              ].map(([label, value]) => <div className="mave-checkout-total-line" key={label}><span>{label}</span><span>{value}</span></div>)}
              <div className="mave-checkout-total-line" style={{ fontSize: 18, fontWeight: 600, color: C.black }}><span>Total</span><span>€89,00</span></div>
            </div>
            <div className="mave-checkout-free">
              <span style={{ width: 44, height: 44, borderRadius: '50%', background: 'rgba(151,204,151,0.24)', display: 'grid', placeItems: 'center' }}><AccountLineIcon type="truck" size={24} /></span>
              <span><strong style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 15, display: 'block', marginBottom: 5 }}>Free shipping</strong><span style={muted}>On all orders over €60</span></span>
            </div>
          </aside>
        </div>

        <section className="mave-checkout-benefits" aria-label="Checkout benefits">
          <div className="mave-checkout-benefit-grid">
            {benefits.map(([icon, title, copy]) => (
              <div className="mave-checkout-benefit" key={title}>
                <span style={{ color: C.goldD }}><AccountLineIcon type={icon} size={32} /></span>
                <span><strong style={{ ...tiny, display: 'block', marginBottom: 8 }}>{title}</strong><span style={muted}>{copy}</span></span>
              </div>
            ))}
          </div>
          <div className="mave-checkout-support">
            <span><strong style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 12, fontWeight: 700, color: C.black, display: 'block', marginBottom: 12 }}>Need help?</strong><button type="button" style={{ border: 0, background: 'transparent', cursor: 'pointer', padding: 0, fontFamily: "'Montserrat',sans-serif", fontSize: 13, color: C.black }}>Contact our support team <span style={{ marginLeft: 20 }}>›</span></button></span>
            <span style={{ display: 'grid', gridTemplateColumns: '34px 1fr', gap: 18, alignItems: 'center' }}><AccountLineIcon type="lock" size={30} /><span style={muted}>Your data is safe and encrypted<br />Learn more about our <button type="button" style={{ border: 0, borderBottom: '1px solid rgba(154,122,66,0.46)', background: 'transparent', color: C.goldD, cursor: 'pointer', padding: 0, font: 'inherit' }}>Privacy Policy</button></span></span>
          </div>
        </section>
      </div>
      <Footer />
    </main>
  );
};

/* в”Ђв”Ђ FOOTER в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */

  const cols = [
    { head:'Care', links:['Core Oils','WOW Serums','Cleanse','Limited Edition'] },
    { head:'MAVE',         links:['Approach','Ingredients','Science','Stockists'] },
    { head:'Service',      links:['Shipping','Returns','Contact','Privacy'] },
  ];
  const lnk = { fontFamily:"'Montserrat',sans-serif", fontSize:11, fontWeight:300, letterSpacing:'0.06em', color:'rgba(245,240,232,0.44)', display:'block', marginBottom:11 };
  return (
    <footer className="mave-site-footer" style={{ background: C.black, padding: '78px 80px 42px', borderTop: '1px solid rgba(200,169,110,0.12)' }}>
      <div className="mave-grid-footer mave-site-footer-grid" style={{ display: 'grid', gridTemplateColumns: '2.2fr 1fr 1fr 1fr', gap: 62, marginBottom: 58 }}>
        <div>
          <div style={{ marginBottom: 8 }}><MaveLogo height={32} /></div>
          <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 9, fontWeight: 400, letterSpacing: '0.26em', textTransform: 'uppercase', color: C.gold, display: 'block', marginBottom: 20 }}>Molecular Cosmetics</span>
          <p style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 12, fontWeight: 300, lineHeight: 1.9, color: 'rgba(245,240,232,0.46)', maxWidth: 300 }}>Molecular system. Controlled depth.</p>
        </div>
        {cols.map(col => (
          <div key={col.head}>
            <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 9, fontWeight: 400, letterSpacing: '0.26em', textTransform: 'uppercase', color: C.gold, display: 'block', marginBottom: 20 }}>{col.head}</span>
            {col.links.map(l => <span key={l} style={lnk}>{l}</span>)}
          </div>
        ))}
      </div>
      <div className="mave-site-footer-divider" style={{ height: 1, background: 'rgba(200,169,110,0.12)', marginBottom: 24 }}></div>
      <div className="mave-site-footer-bottom" style={{ display: 'flex', justifyContent: 'space-between', gap: 28, flexWrap: 'wrap' }}>
        <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 10, fontWeight: 300, letterSpacing: '0.07em', color: 'rgba(245,240,232,0.28)' }}>© 2026 MAVE® Molecular Cosmetics. All rights reserved.</span>
        <span style={{ fontFamily: "'Montserrat',sans-serif", fontSize: 10, fontWeight: 300, letterSpacing: '0.07em', color: 'rgba(245,240,232,0.28)' }}>MAVE® Molecular Cosmetics</span>
      </div>
    </footer>
  );
};

/* в”Ђв”Ђ APP в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ */
const App = () => {
  const [productPage, setProductPage] = React.useState(() => productFromUrl());
  const [view, setView] = React.useState(() => viewFromUrl());
  const [cartOpen, setCartOpen] = React.useState(false);
  const [cart, setCart]         = React.useState([]);

  const addToCart = (product, qty) => {
    setCart(prev => {
      const exists = prev.find(i => i.id === product.id);
      if (exists) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + qty } : i);
      return [...prev, { ...product, qty }];
    });
    setCartOpen(true);
  };
  const removeFromCart = id => setCart(prev => prev.filter(i => i.id !== id));
  const changeCartQty = (id, delta) => setCart(prev => prev
    .map(i => i.id === id ? { ...i, qty: i.qty + delta } : i)
    .filter(i => i.qty > 0)
  );

  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  React.useEffect(() => {
    if (productPage) window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [productPage]);
  React.useEffect(() => {
    const onPop = () => {
      setProductPage(productFromUrl());
      setView(viewFromUrl());
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  const openProduct = product => {
    setProductUrl(product);
    setProductPage(product);
    setView('catalog');
  };
  const closeProduct = () => {
    setViewUrl('catalog');
    setProductPage(null);
    setView('catalog');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openCatalog = () => {
    setViewUrl('catalog');
    setProductPage(null);
    setView('catalog');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openScience = () => {
    setViewUrl('science');
    setProductPage(null);
    setView('science');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openAccount = () => {
    setViewUrl('account');
    setProductPage(null);
    setView('account');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openProfile = () => {
    setViewUrl('profile');
    setProductPage(null);
    setView('profile');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openOrders = () => {
    setViewUrl('orders');
    setProductPage(null);
    setView('orders');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openAddresses = () => {
    setViewUrl('addresses');
    setProductPage(null);
    setView('addresses');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openOrderDetail = () => {
    setViewUrl('orderDetail');
    setProductPage(null);
    setView('orderDetail');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openRegister = () => {
    setViewUrl('register');
    setProductPage(null);
    setView('register');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openForgot = () => {
    setViewUrl('forgot');
    setProductPage(null);
    setView('forgot');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openLanding = () => {
    setViewUrl('landing');
    setProductPage(null);
    setView('landing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openLandingSection = id => {
    setViewUrl('landing');
    setProductPage(null);
    setView('landing');
    setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  };
  const closeCatalog = () => {
    setViewUrl('landing');
    setView('landing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <motion.div
      initial={{ opacity: 1, scale: 1 }}
      animate={{ opacity: 1, scale: 1 }}
      exit={{ opacity: 1, scale: 1 }}
      transition={{ duration: 0 }}
      style={{ background: C.cream, overflowX: 'hidden' }}
    >
      <Header
        cartCount={cartCount}
        onCartOpen={() => setCartOpen(true)}
        onCatalogOpen={openCatalog}
        onHome={openLanding}
        onSectionOpen={openLandingSection}
        onScienceOpen={openScience}
        onAccountOpen={openAccount}
        surface={productPage || view === 'catalog' || view === 'account' || view === 'profile' || view === 'orders' || view === 'orderDetail' || view === 'addresses' || view === 'checkoutContact' || view === 'register' || view === 'forgot' ? 'light' : 'dark'}
        activeView={productPage ? '' : view}
      />
      {productPage ? (
        <ProductPage product={productPage} onBack={closeProduct} onAdd={addToCart} onSelect={openProduct} />
      ) : view === 'account' ? (
        <AccountDashboardPage onBack={openLanding} onOrders={openOrders} onProfile={openProfile} onAddresses={openAddresses} />
      ) : view === 'profile' ? (
        <ProfileSettingsPage onDashboard={openAccount} onOrders={openOrders} onProfile={openProfile} onAddresses={openAddresses} />
      ) : view === 'orders' ? (
        <OrdersPage onDashboard={openAccount} onOrderDetail={openOrderDetail} onProfile={openProfile} onAddresses={openAddresses} />
      ) : view === 'orderDetail' ? (
        <OrderDetailPage onDashboard={openAccount} onOrders={openOrders} onProfile={openProfile} onAddresses={openAddresses} />
      ) : view === 'addresses' ? (
        <AddressesPage onDashboard={openAccount} onOrders={openOrders} onProfile={openProfile} />
      ) : view === 'checkoutContact' ? (
        <CheckoutContactPage onLogin={openAccount} mode={new URLSearchParams(window.location.search).get('state') === 'loggedin' ? 'loggedin' : 'guest'} />
      ) : view === 'register' ? (
        <RegisterPage onBack={openLanding} onLogin={openAccount} />
      ) : view === 'forgot' ? (
        <ForgotPasswordPage onBack={openLanding} onLogin={openAccount} onRegister={openRegister} />
      ) : view === 'science' ? (
        <SciencePage onBack={openLanding} onSelect={openProduct} />
      ) : view === 'catalog' ? (
        <CatalogPage onBack={closeCatalog} onSelect={openProduct} />
      ) : (
        <>
          <Hero onCatalogOpen={openCatalog} />
          <BrandStatement />
          <LiquidReveal onCatalogOpen={openCatalog} />
          <OilDropMoment onCatalogOpen={openCatalog} />
          <RoutineSection onSelect={openProduct} />
          <FeaturedProducts onSelect={openProduct} />
          <Marquee />
          <EditorialTrio onSelect={openProduct} />
          <SplitFeature onSelect={openProduct} onCatalogOpen={openCatalog} />
          <Testimonials />
          <IngredientsStrip />
          <FullBleedCTA onCatalogOpen={openCatalog} />
          <Footer />
        </>
      )}
      <CartSidebar cart={cart} isOpen={cartOpen} onClose={() => setCartOpen(false)} onRemove={removeFromCart} onQtyChange={changeCartQty} />
    </motion.div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
